name: Release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install pinned contract toolchain
        run: |
          python -m pip install --upgrade pip==25.2
          python -m pip install -r requirements-dev.txt
      - name: GenVM lint and validation
        run: genvm-lint check contracts/agent_warranty.py
      - name: Direct Mode adversarial tests
        run: python -m pytest tests/direct -v --strict-markers --junitxml=direct-mode-results.xml
      - name: Report Direct Mode failures as check annotations
        if: failure()
        run: |
          python - <<'PY'
          from pathlib import Path
          from xml.etree import ElementTree

          report = Path("direct-mode-results.xml")
          if not report.exists():
              print("::error::Direct Mode failed before producing its JUnit report")
              raise SystemExit(0)
          root = ElementTree.parse(report).getroot()
          failed = 0
          for case in root.iter("testcase"):
              result = case.find("failure")
              if result is None:
                  result = case.find("error")
              if result is None:
                  continue
              failed += 1
              detail = " ".join((result.get("message", "") + " " + (result.text or "")).split())
              escaped = detail[:1200].replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A").replace(":", "%3A").replace(",", "%2C")
              print(f"::error file={case.get('file', 'tests/direct')},line={case.get('line', '1')}::FAILED {case.get('name', 'unknown')}: {escaped}")
          if failed == 0:
              print("::error::Direct Mode failed but JUnit contained no failing test case")
          PY
      - name: Regenerate and verify the committed ABI
        run: |
          genvm-lint schema contracts/agent_warranty.py --output abi/agent_warranty.schema.json
          git diff --exit-code -- abi/agent_warranty.schema.json
