name: Release gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'
      - name: Install pinned contract toolchain
        run: |
          python -m pip install --upgrade pip==25.2
          python -m pip install -r requirements-dev.txt
      - name: GenVM lint and validation
        run: genvm-lint check contracts/agent_warranty.py
      - name: Direct Mode adversarial tests
        run: python -m pytest tests/direct -v --strict-markers
      - name: Regenerate and verify the committed ABI
        run: |
          genvm-lint schema contracts/agent_warranty.py --output abi/agent_warranty.schema.json
          git diff --exit-code -- abi/agent_warranty.schema.json
